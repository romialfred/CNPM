    NotFound:
      description: Ressource introuvable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflit d’état ou d’idempotence
      content:
        application/problem+json:
          schema:
