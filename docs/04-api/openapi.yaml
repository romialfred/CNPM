    OrganizationInput:
      type: object
      description: >-
        Corps de création d'une entreprise. Le statut initial (PROSPECT) et le niveau de
        risque (NORMAL) ne sont pas fournis par le client. Le couple identifierType +
        identifierValue est l'identifiant métier unique servant de clé d'idempotence.
      required:
      - legalName
      - organizationType
      - identifierType
      - identifierValue
      properties:
        legalName:
          type: string
          minLength: 1
          maxLength: 255
        tradeName:
          type: string
          maxLength: 255
          nullable: true
        organizationType:
          type: string
          minLength: 1
          maxLength: 40
        sectorCode:
          type: string
          maxLength: 80
          nullable: true
        identifierType:
          type: string
          minLength: 1
          maxLength: 40
          description: >-
            Type d'identifiant métier. Le BRS n'exige que RCCM et NIF (les termes NINA et IFU
            n'y figurent pas) ; la nomenclature exacte et le caractère obligatoire par forme
            juridique restent à confirmer (DATA-DEC-008).
        identifierValue:
          type: string
          minLength: 1
          maxLength: 160
      additionalProperties: false
    OrganizationUpdate:
      type: object
      description: >-
        Modification partielle des champs descriptifs d'une entreprise. Tout champ absent
        reste inchangé. Le statut, le niveau de risque et l'identifiant métier ne sont pas
        modifiables ici.
      properties:
        legalName:
          type: string
          minLength: 1
          maxLength: 255
        tradeName:
          type: string
          maxLength: 255
        organizationType:
          type: string
          minLength: 1
          maxLength: 40
        sectorCode:
          type: string
          maxLength: 80
      additionalProperties: false
