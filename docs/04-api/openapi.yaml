      - PORTAL
      summary: Afficher cotisations et soldes.
      description: >-
        Appels de cotisation du membre connecté. Le périmètre est déduit du compte
        authentifié : **aucun identifiant d'adhésion n'est accepté en entrée**, et un compte
        sans adhésion rattachée obtient 404. Collection paginée et bornée côté serveur.
      operationId: getMemberContributions
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - A_ECHOIR
          - EN_RETARD
          - PARTIELLE
          - REGLEE
      - name: exercise
        in: query
        schema:
          type: integer
          minimum: 2000
          maximum: 2999
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - dueDate
          - reference
          - status
          default: dueDate
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
