  /admin/security/accounts:
    post:
      tags:
      - ADMIN
      summary: Créer un compte de la plateforme.
      description: >-
        Le compte naît « invité » : aucun mot de passe ne transite par cette API et le
        second facteur reste à enrôler à la première connexion (AUTH-007). Création
        sensible, donc protégée par une clé d'idempotence — un rejeu de la même clé
        renvoie le compte déjà créé sans en créer un second.
      operationId: createAdminSecurityAccount
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSecurityAccountInput'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          description: Rejeu idempotent — le compte existait déjà pour cette clé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSecurityAccount'
        '201':
          description: Compte créé, invité, second facteur en attente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSecurityAccount'
      x-requirements:
      - BO-030
  /admin/security/accounts/{accountId}/status:
    post:
      tags:
      - ADMIN
      summary: Suspendre ou réactiver un compte.
      description: >-
        Opération sensible : le motif est obligatoire et l'événement d'audit est écrit
        dans la même transaction que le changement d'état.
      operationId: changeAdminSecurityAccountStatus
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: accountId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSecurityAccountStatusInput'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          description: Compte dans son nouvel état.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSecurityAccount'
      x-requirements:
      - BO-030
  /admin/security/accounts/{accountId}:
    delete:
      tags:
      - ADMIN
      summary: Supprimer un compte de la plateforme.
      description: >-
        Supprime définitivement le compte et ses rattachements (rôles, second facteur,
        jetons d'accès), libérant l'adhésion éventuellement liée. Aucune écriture financière
        n'étant rattachée à un compte, rien d'immuable n'est touché. Un opérateur ne peut pas
        supprimer son propre compte. Le motif est obligatoire et tracé avant la suppression.
      operationId: deleteAdminSecurityAccount
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: accountId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSecurityReasonInput'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: L'opérateur vise son propre compte.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '204':
          description: Compte supprimé.
      x-requirements:
      - BO-030
  /admin/security/accounts/{accountId}/password-reset:
    post:
      tags:
      - ADMIN
      summary: Émettre un lien d'activation ou de récupération d'accès.
      description: >-
        Émet un jeton à usage unique et à durée bornée, remis **une seule fois** dans cette
        réponse : seule son empreinte est conservée, il ne pourra pas être relu. Le
        titulaire pose ensuite lui-même son mot de passe via `/auth/password` —
        l'administration ne le connaît jamais, ce qui préserve la non-répudiation des
        actions de l'utilisateur. Émettre un nouveau jeton invalide les précédents.
      operationId: issueAccountCredentialToken
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: accountId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Compte suspendu — rétablir son accès contournerait la suspension.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '200':
          description: Jeton émis, à transmettre au titulaire du compte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCredentialToken'
      x-requirements:
      - BO-030
  /admin/security/accounts/{accountId}/two-factor/reset:
    post:
      tags:
      - ADMIN
      summary: Réinitialiser le second facteur d'un compte.
      description: >-
        Efface le secret TOTP et les codes de secours du compte visé : à sa prochaine
        connexion, l'utilisateur ré-enrôle son second facteur. Aucun secret n'est renvoyé.
        Le motif est obligatoire et tracé.
      operationId: resetAdminSecurityAccountTwoFactor
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: accountId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSecurityReasonInput'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: Compte dont le second facteur est repassé en attente d'enrôlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSecurityAccount'
      x-requirements:
      - BO-030
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://iam.example.cnpm.ml/realms/cnpm/protocol/openid-connect/auth
          tokenUrl: https://iam.example.cnpm.ml/realms/cnpm/protocol/openid-connect/token
          scopes:
            openid: Identité
            profile: Profil
            offline_access: Renouvellement contrôlé
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 100
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    CurrentUser:
      type: object
      description: >-
        Projection du jeton authentifié et des autorités dérivées par le serveur.
        Les permissions proviennent exclusivement du mapping RBAC serveur. L'état du
        second facteur (`mfaEnrolled`, `mfaRequired`) reflète le fournisseur d'identité
        (Keycloak, ADR-003) ; il n'exprime aucune politique CNPM inventée. Les méthodes
        2FA autorisées, les codes de secours et la récupération restent portés par
        UX-DEC-011 et ne figurent volontairement pas ici tant que la décision est ouverte.
        Le périmètre ABAC n'est pas encore déclaré (ADR-008).
      required:
      - subject
      - username
      - email
      - roles
      - permissions
      properties:
        subject:
          type: string
          minLength: 1
          description: Identifiant immuable du sujet dans le fournisseur d'identité.
        username:
          type: string
          nullable: true
          description: Nom utilisateur préféré lorsque la revendication est présente.
        email:
          type: string
          format: email
          nullable: true
          description: Adresse e-mail lorsque la revendication est présente.
        displayName:
          type: string
          nullable: true
          description: >-
            Nom lisible du compte, résolu depuis iam.user_account.display_name pour
            l'affichage du shell ; null lorsqu'il est absent (le client retombe sur l'e-mail).
        roleLabel:
          type: string
          nullable: true
          description: >-
            Libellé de rôle lisible pour l'affichage, résolu depuis iam.role.label ; null
            lorsqu'il n'est pas résolu.
        roles:
          type: array
          uniqueItems: true
          description: Rôles de realm sans le préfixe technique ROLE_, triés par code.
          items:
            type: string
        permissions:
          type: array
          uniqueItems: true
          description: >-
            Permissions RBAC dérivées côté serveur, sans le préfixe technique
            PERM_, triées par code.
          items:
            type: string
        mfaEnrolled:
          type: boolean
          nullable: true
          description: >-
            Vrai si un second facteur est enrôlé pour ce compte selon le fournisseur
            d'identité. `null` lorsque le jeton ne porte pas l'information : le serveur
            ne l'invente pas. Sert à décider, côté client, si l'enrôlement doit être
            proposé — jamais à contourner le contrôle du fournisseur d'identité.
        mfaRequired:
          type: boolean
          nullable: true
          description: >-
            Vrai si le fournisseur d'identité impose l'enrôlement d'un second facteur
            avant d'accorder l'accès complet (required action Keycloak). C'est un fait
            porté par Keycloak, pas une politique CNPM définie ici. `null` si absent
            du jeton.
      additionalProperties: false
    Uuid:
      type: string
      format: uuid
    PublicHighlights:
      type: object
      description: >-
        Chiffres clés publics de l'accueil (PUB-001) : dénombrements agrégés non nominatifs.
        L'éditorial (`news`) reste vide côté serveur — il est réservé au profil de démonstration.
      required:
      - metrics
      - news
      - sourceNotice
      properties:
        metrics:
          type: array
          description: Indicateurs publics du CNPM.
          items:
            type: object
            required:
            - id
            - label
            - value
            properties:
              id:
                type: string
              label:
                type: string
              value:
                type: integer
                format: int64
              unit:
                type: string
                nullable: true
                enum:
                - percent
                - currency
        news:
          type: array
          description: Toujours vide via cette API publique (éditorial réservé à la démonstration).
          items:
            type: object
        sourceNotice:
          type: string
          description: Provenance affichée avec les valeurs pour éviter toute confusion institutionnelle.
        dataAsOf:
          type: string
          format: date-time
          nullable: true
          description: Date de constat des chiffres ; null si la source ne la porte pas.
    MemberDetail:
      type: object
      description: >-
        Fiche membre 360° (BO-003) : identité, adhésion, cotisations, paiements, historique,
        alertes et risque, agrégés en lecture seule. Le showcase public R4 (réalisations,
        galerie, certifications) reste hors périmètre tant que sa checklist n'est pas close.
      required:
      - identity
      - profile
      - summary
      - contributions
      - payments
      - documents
      - history
      - alerts
      - nextActions
      - permissions
      properties:
        identity:
          type: object
        profile:
          type: object
        mainContact:
          type: object
          nullable: true
        summary:
          type: object
        contributions:
          type: array
          items:
            type: object
        payments:
          type: array
          items:
            type: object
        documents:
          type: array
          items:
            type: object
        history:
          type: array
          items:
            type: object
        alerts:
          type: array
          items:
            type: object
        nextActions:
          type: array
          items:
            type: object
        risk:
          type: object
          nullable: true
        agent:
          type: object
          nullable: true
        permissions:
          type: object
    MemberOverview:
      type: object
      description: >-
        Synthèse du répertoire des membres (BO-002) : volet de synthèse, options de filtre et
        agrégats de cotisation (due/payée) par organisation.
      required:
      - overview
      - categories
      - groups
      - financials
      properties:
        overview:
          type: object
        categories:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        financials:
          type: array
          items:
            type: object
    AdminSecuritySnapshot:
      type: object
      description: >-
        Instantané Administration et sécurité (BO-030) : comptes, rôles, matrice de
        permissions (lecture seule), sessions, audit, posture et compteurs. Aucun secret.
      required:
      - accounts
      - roles
      - permissions
      - sessions
      - audit
      - policy
      - posture
      - counts
      - canManagePermissions
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AdminSecurityAccount'
        roles:
          type: array
          items:
            type: object
        permissions:
          type: array
          items:
            type: object
        sessions:
          type: array
          items:
            type: object
        audit:
          type: array
          items:
            type: object
        policy:
          type: array
          items:
            type: object
        posture:
          type: object
        counts:
          type: object
        canManagePermissions:
          type: boolean
    MemberContributionStatus:
      type: string
      description: >-
        État d'affichage dérivé du solde et de l'échéance : REGLEE si le solde est nul,
        EN_RETARD si l'échéance est passée et qu'il reste un solde, PARTIELLE si un
        paiement a réduit le solde sans l'éteindre, A_ECHOIR sinon. Le retard prime sur le
        partiel.
      enum:
      - A_ECHOIR
      - EN_RETARD
      - PARTIELLE
      - REGLEE
    MemberContributionSummary:
      type: object
      required:
      - id
      - reference
      - exercise
      - dueDate
      - calledAmount
      - paidAmount
      - outstandingAmount
      - currency
      - status
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        reference:
          type: string
          maxLength: 60
        exercise:
          type: integer
        dueDate:
          type: string
          format: date
        calledAmount:
          type: string
          pattern: ^-?\d{1,17}(\.\d{1,2})?$
        paidAmount:
          type: string
          pattern: ^-?\d{1,17}(\.\d{1,2})?$
        outstandingAmount:
          type: string
          pattern: ^-?\d{1,17}(\.\d{1,2})?$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        status:
          $ref: '#/components/schemas/MemberContributionStatus'
    MemberContributionPage:
      type: object
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      - availableExercises
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberContributionSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        availableExercises:
          type: array
          description: Exercices réellement présents pour cette adhésion, pour ne pas proposer une année vide au filtre.
          items:
            type: integer
    MemberContributionInstallment:
      type: object
      required:
      - id
      - label
      - dueDate
      - expectedAmount
      - paidAmount
      - outstandingAmount
      - currency
      - status
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        label:
          type: string
        dueDate:
          type: string
          format: date
        expectedAmount:
          type: string
          pattern: ^-?\d{1,17}(\.\d{1,2})?$
        paidAmount:
          type: string
          pattern: ^-?\d{1,17}(\.\d{1,2})?$
        outstandingAmount:
          type: string
          pattern: ^-?\d{1,17}(\.\d{1,2})?$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        status:
          $ref: '#/components/schemas/MemberContributionStatus'
    MemberContributionAdjustment:
      type: object
      required:
      - reference
      - direction
      - amount
      - currency
      - reason
      - recordedOn
      properties:
        reference:
          type: string
        direction:
          type: string
          enum:
          - CREDIT
          - DEBIT
        amount:
          type: string
          pattern: ^-?\d{1,17}(\.\d{1,2})?$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        reason:
          type: string
        recordedOn:
          type: string
          format: date
    MemberContributionDetail:
      allOf:
      - $ref: '#/components/schemas/MemberContributionSummary'
      - type: object
        required:
        - issuedOn
        - amountOriginNote
        - adjustments
        - schedule
        properties:
          issuedOn:
            type: string
            format: date
          amountOriginNote:
            type: string
            description: Note factuelle situant l'appel ; elle n'explique aucun calcul de barème que cette projection ne connaît pas.
          adjustments:
            type: array
            items:
              $ref: '#/components/schemas/MemberContributionAdjustment'
          schedule:
            type: array
            items:
              $ref: '#/components/schemas/MemberContributionInstallment'
    AccountCredentialToken:
      type: object
      description: >-
        Jeton d'activation ou de récupération, restitué une seule fois. Seule son empreinte
        SHA-256 est conservée : il ne peut pas être relu, et une fuite de la base ne livre
        aucun jeton utilisable.
      required:
      - token
      - expiresAt
      - activation
      properties:
        token:
          type: string
          description: À transmettre au titulaire du compte et à ne conserver nulle part.
        expiresAt:
          type: string
          format: date-time
        activation:
          type: boolean
          description: >-
            Vrai pour une première mise en service (le compte n'avait aucun mot de passe),
            faux pour une récupération d'accès. Distinguer les deux évite d'annoncer une
            « réinitialisation » à qui n'a jamais eu de mot de passe.
    SetPasswordInput:
      type: object
      description: >-
        Le mot de passe n'est accepté que dans le corps de la requête, jamais en paramètre
        d'URL : une URL se retrouve dans les journaux de serveurs, de proxys et d'historiques.
      required:
      - token
      - password
      properties:
        token:
          type: string
          maxLength: 200
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 200
          description: Longueur minimale de 12 caractères (plancher technique, cf. AUTH-DEC-027).
      additionalProperties: false
    NativeCredentialsInput:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          description: Mot de passe applicatif. Jamais journalisé, jamais renvoyé, jamais placé en paramètre d'URL.
      additionalProperties: false
    AuthChallengeInput:
      type: object
      required:
      - challenge
      properties:
        challenge:
          type: string
          description: Jeton de défi remis par `/auth/login`. Opaque, à durée de vie courte, à usage unique.
      additionalProperties: false
    AuthCodeInput:
      type: object
      description: >-
        Un code TOTP OU un code de secours. Fournir les deux n'ouvre aucun droit
        supplémentaire ; le serveur tranche selon ce qu'il reçoit.
      required:
      - challenge
      properties:
        challenge:
          type: string
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: Code à usage unique à six chiffres produit par l'application d'authentification.
        recoveryCode:
          type: string
          description: Code de secours mono-usage, accepté à la place du code TOTP.
      additionalProperties: false
    TotpEnrollment:
      type: object
      description: >-
        Éléments d'enrôlement, à afficher une seule fois. La clé manuelle est l'alternative
        au QR code lorsque la caméra n'est pas utilisable ; elle n'est plus jamais restituée
        ensuite.
      required:
      - manualKey
      - otpAuthUri
      properties:
        manualKey:
          type: string
        otpAuthUri:
          type: string
          description: URI `otpauth://totp/...` à encoder en QR code côté client.
    AuthSession:
      type: object
      required:
      - status
      - accessToken
      properties:
        status:
          type: string
          enum:
          - AUTHENTICATED
        accessToken:
          type: string
          description: Jeton de session applicatif (HS256, durée de vie bornée).
        recoveryCodes:
          type: array
          description: Remis UNIQUEMENT à l'activation du second facteur ; seules leurs empreintes sont conservées.
          items:
            type: string
    AuthChallenge:
      type: object
      required:
      - errorCode
      - errorMessage
      - challenge
      properties:
        errorCode:
          type: string
          enum:
          - MFA_REQUIRED
          - MFA_ENROLLMENT_REQUIRED
        errorMessage:
          type: string
        challenge:
          type: string
    AuthFailure:
      type: object
      description: >-
        Échec d'une étape d'authentification. Format propre au parcours de connexion et
        distinct du `Problem` du reste de l'API — divergence assumée et consignée
        (AUTH-DEC-024). Le message reste volontairement pauvre : il ne dit ni si le compte
        existe, ni quelle partie a échoué.
      required:
      - errorCode
      - errorMessage
      properties:
        errorCode:
          type: string
          enum:
          - INVALID_CREDENTIALS
          - NO_ROLE_ASSIGNED
          - MFA_ERROR
          - MFA_CHALLENGE_LOCKED
          - MFA_CHALLENGE_INVALID
          - MFA_CODE_INVALID
        errorMessage:
          type: string
    AdminSecurityAccount:
      type: object
      description: >-
        Compte de la plateforme tel qu'exposé à l'écran d'administration. Aucun secret n'y
        figure : ni mot de passe, ni jeton, ni secret TOTP, ni code de secours. `INVITED`
        désigne un compte créé qui n'a pas encore ouvert de session ; il se distingue d'un
        compte suspendu. De même, un second facteur `PENDING` (jamais enrôlé) n'est pas un
        second facteur `DISABLED` (retiré) — les confondre relancerait le mauvais flux.
      required:
      - id
      - fullName
      - email
      - roleId
      - roleLabel
      - status
      - twoFactor
      - activeSessions
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        fullName:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 320
        roleId:
          type: string
          description: Identifiant du rôle principal, ou chaîne vide si aucun rôle n'est attribué.
        roleLabel:
          type: string
        accountType:
          type: string
          enum:
          - PROFESSIONAL
          - MEMBER
        phone:
          type: string
          maxLength: 40
        jobTitle:
          type: string
          maxLength: 150
        organization:
          type: string
          maxLength: 255
        department:
          type: string
          maxLength: 150
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - INVITED
        twoFactor:
          type: string
          enum:
          - ENABLED
          - PENDING
          - DISABLED
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        lastLoginLabel:
          type: string
          nullable: true
          description: Libellé fr-ML déjà formaté par le serveur, pour un rendu stable quel que soit le fuseau du poste.
        activeSessions:
          type: integer
          minimum: 0
    AdminSecurityAccountInput:
      type: object
      description: >-
        Création d'un compte. Aucun mot de passe n'est accepté : l'accès s'établit à la
        première connexion, où le second facteur est enrôlé.
      required:
      - accountType
      - firstName
      - lastName
      - email
      - roleId
      properties:
        accountType:
          type: string
          enum:
          - PROFESSIONAL
          - MEMBER
        firstName:
          type: string
          minLength: 1
          maxLength: 120
        lastName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        phone:
          type: string
          maxLength: 40
        jobTitle:
          type: string
          maxLength: 150
        organization:
          type: string
          maxLength: 255
        department:
          type: string
          maxLength: 150
        roleId:
          $ref: '#/components/schemas/Uuid'
        memberId:
          $ref: '#/components/schemas/Uuid'
      additionalProperties: false
    AdminSecurityAccountStatusInput:
      type: object
      required:
      - status
      - reason
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        reason:
          type: string
          minLength: 3
          maxLength: 1000
      additionalProperties: false
    AdminSecurityReasonInput:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
      additionalProperties: false
    Money:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          pattern: ^-?\d{1,17}(\.\d{1,2})?$
          example: '125000.00'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          example: XOF
    AuditFields:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/Uuid'
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    Resource:
      type: object
      required:
      - id
      - status
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        businessReference:
          type: string
        status:
          type: string
        attributes:
          type: object
          additionalProperties: true
        audit:
          $ref: '#/components/schemas/AuditFields'
    ResourceInput:
      type: object
      properties:
        businessReference:
          type: string
        attributes:
          type: object
          additionalProperties: true
      additionalProperties: false
    DecisionInput:
      type: object
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
          - CANCEL
          - CONFIRM
        reason:
          type: string
          minLength: 3
          maxLength: 1000
    PageResource:
      type: object
      required:
      - items
      - page
      - size
      - totalElements
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    ReferenceValueView:
      type: object
      description: Valeur de référentiel typée (schéma R0, sans additionalProperties).
      required:
      - id
      - domain
      - code
      - label
      - sortOrder
      - active
      - version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        domain:
          type: string
          maxLength: 80
        code:
          type: string
          maxLength: 80
        label:
          type: string
          maxLength: 255
        sortOrder:
          type: integer
        active:
          type: boolean
        validFrom:
          type: string
          format: date-time
          nullable: true
        validTo:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int64
          description: Version de verrouillage optimiste, à renvoyer dans `If-Match` pour une mise à jour.
      additionalProperties: false
    ReferenceValueInput:
      type: object
      description: Charge de création d'une valeur de référentiel (schéma R0 typé).
      required:
      - domain
      - code
      - label
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 80
        code:
          type: string
          minLength: 1
          maxLength: 80
        label:
