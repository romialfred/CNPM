  /enrollment-applications/{id}/start-review:
    post:
      tags:
      - ENROLLMENT
      summary: Prendre le dossier en charge pour contrôle.
      description: >-
        Fait passer le dossier de SUBMITTED à UNDER_REVIEW et l'assigne au contrôleur. La
        machine à états normative (docs/07-processes/state-machines.md) impose le passage par
        UNDER_REVIEW avant toute décision : cette opération en est le seul point d'entrée,
        ce qui rend le contrôle (ENROLLMENT.REVIEW) prérequis de la décision
        (ENROLLMENT.APPROVE). Elle comble une opération absente du catalogue initial.
      operationId: startEnrollmentReview
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
