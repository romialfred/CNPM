        comment:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false
    EnrollmentApprovalInput:
      type: object
      description: >-
        Corps d'une approbation d'enrôlement, qui vaut activation du membre. Le numéro
        d'adhésion et la catégorie de cotisation sont FOURNIS par le décideur : la règle de
        catégorisation dépend du barème (DEC-008, ouverte) et le format du numéro n'est fixé
        par aucune source (ENR-DEC-001). Leur automatisation ultérieure ne rompra pas ce
        contrat. Le commentaire est facultatif.
      required:
      - membershipNumber
      - categoryCode
      properties:
        membershipNumber:
          type: string
          minLength: 1
          maxLength: 60
        categoryCode:
          type: string
          minLength: 1
          maxLength: 50
        comment:
          type: string
          maxLength: 2000
      additionalProperties: false
    EnrollmentRejectionInput:
      type: object
      description: >-
        Corps d'un rejet d'enrôlement. Le motif (comment) est OBLIGATOIRE : une décision
        défavorable non motivée n'est pas opposable au demandeur. reasonCode reste libre, le
        référentiel des motifs n'étant pas fourni par les sources (ENR-DEC-001).
      required:
      - comment
      properties:
        reasonCode:
          type: string
          maxLength: 60
        comment:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false
