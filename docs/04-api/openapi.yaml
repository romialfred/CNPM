        organizationId:
          $ref: '#/components/schemas/Uuid'
        channel:
          type: string
          maxLength: 30
        status:
          type: string
          enum: [DRAFT, SUBMITTED, UNDER_REVIEW, COMPLEMENT_REQUIRED, APPROVED, REJECTED]
        submittedAt:
          type: string
          format: date-time
          nullable: true
        assignedTo:
