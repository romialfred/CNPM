openapi: 3.1.0
info:
  title: CNPM Digital Platform API
  version: 1.0.0
  description: Contrat API de référence pour les portails Web, mobile, back-office et intégrations CNPM.
servers:
- url: https://api.example.cnpm.ml/v1
  description: URL de production à confirmer
- url: https://api.sandbox.example.cnpm.ml/v1
  description: Sandbox à confirmer
security:
- oauth2:
  - openid
tags:
- name: ADMIN
  description: Administration et paramétrage
- name: MEMBER
  description: Membres et entreprises
- name: ENROLLMENT
  description: Enrôlement et adhésion
- name: CONTRIBUTION
  description: Cotisations et échéanciers
- name: PAYMENT
  description: Paiements et rapprochement
- name: RECEIPT
  description: Reçus et attestations
- name: RECOVERY
  description: Recouvrement et relances
- name: PORTAL
  description: Portail et application membre
- name: REQUEST
  description: Requêtes et réclamations
- name: GROUP
  description: Groupements professionnels
- name: INCENTIVE
  description: Primes et partage de revenus
- name: DOCUMENT
  description: Gestion électronique des documents
- name: EVENT
  description: Événements et formations
- name: REPORT
  description: Décisionnel et reporting
- name: SECURITY
  description: Sécurité et identité
- name: AUDIT
  description: Audit et conformité
- name: INTEGRATION
  description: Intégrations et interopérabilité
- name: AUTH
  description: Identité et contexte utilisateur
paths:
  /auth/me:
    get:
      tags:
      - AUTH
      summary: Lire le profil, les rôles et les permissions du compte courant.
      operationId: getCurrentUser
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '200':
          description: Ressource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
  /auth/step-up:
    post:
      tags:
      - AUTH
      summary: Déclencher une authentification renforcée.
      operationId: requestStepUp
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '200':
          description: Opération effectuée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '201':
          description: Ressource créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
  /auth/login:
    post:
      tags:
      - AUTH
      summary: Étape identifiants de l'authentification native.
      description: >-
        Vérifie l'identifiant et le mot de passe applicatif, puis émet un défi de second
        facteur. **Aucune session n'est jamais délivrée ici** : l'accès complet ne s'obtient
        qu'après `/auth/mfa/verify` (compte enrôlé) ou `/auth/mfa/enroll/confirm` (première
        connexion). Identifiant inconnu et mot de passe erroné produisent la même réponse
        401, pour ne pas révéler l'existence d'un compte.
      operationId: submitNativeCredentials
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeCredentialsInput'
      responses:
        '401':
          description: Identifiants non reconnus (réponse volontairement indifférenciée).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFailure'
        '403':
          description: Aucun rôle attribué — sans rôle, aucun second facteur n'est exigible, donc aucun accès n'est ouvert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFailure'
        '428':
          description: >-
            Second facteur requis. `MFA_REQUIRED` pour un compte déjà enrôlé,
            `MFA_ENROLLMENT_REQUIRED` pour une première connexion. Le défi renvoyé est
            l'unique entrée des étapes suivantes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallenge'
      x-requirements:
      - AUTH-007
  /auth/password:
    post:
      tags:
      - AUTH
      summary: Poser son mot de passe avec un jeton à usage unique.
      description: >-
        Le titulaire du compte pose lui-même son secret, sur présentation du jeton reçu à
        l'activation ou à la récupération d'accès. Route publique par nécessité : c'est le
        jeton qui autorise, et exiger une session rendrait la récupération impossible pour
        qui a justement perdu son accès. Le second facteur déjà enrôlé n'est pas touché.
        La réponse est vide : confirmer quoi que ce soit sur le compte ferait de ce point
        d'entrée un oracle d'existence.
      operationId: setAccountPassword
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordInput'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: >-
            Jeton inconnu, expiré ou déjà consommé, ou mot de passe trop court. Les trois
            premiers cas se répondent à l'identique, pour ne pas indiquer lequel est vrai.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '204':
          description: Mot de passe posé ; le jeton est consommé.
      x-requirements:
      - PRT-001
  /auth/mfa/enroll/start:
    post:
      tags:
      - AUTH
      summary: Commencer l'enrôlement du second facteur.
      description: >-
        Remet la clé manuelle et l'URI `otpauth://` à présenter en QR code. Le secret est
        détenu chiffré par l'application (AES-GCM) et n'est jamais renvoyé en clair au-delà
        de cet enrôlement, qui exige un défi valide obtenu à l'étape identifiants.
      operationId: startTotpEnrollment
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChallengeInput'
      responses:
        '401':
          description: Défi absent, expiré ou invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFailure'
        '429':
          description: Trop de tentatives — le défi est verrouillé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFailure'
        '200':
          description: Éléments d'enrôlement à afficher une seule fois.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollment'
      x-requirements:
      - AUTH-007
  /auth/mfa/enroll/confirm:
    post:
      tags:
      - AUTH
      summary: Activer le second facteur avec le premier code produit.
      description: >-
        Le premier code valide prouve la possession de l'appareil : le second facteur
        devient actif et la session s'ouvre dans la foulée, sans imposer une reconnexion.
        Les codes de secours sont remis **une seule fois** ici ; seules leurs empreintes
        sont conservées.
      operationId: confirmTotpEnrollment
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCodeInput'
      responses:
        '401':
          description: Code refusé, ou défi absent, expiré ou invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFailure'
        '429':
          description: Trop de tentatives — le défi est verrouillé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFailure'
        '200':
          description: Second facteur activé, session ouverte, codes de secours remis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
      x-requirements:
      - AUTH-007
  /auth/mfa/verify:
    post:
      tags:
      - AUTH
      summary: Vérifier le second facteur et ouvrir la session.
      description: >-
        Accepte un code TOTP à six chiffres ou un code de secours mono-usage. Un même pas
        TOTP ne peut pas être rejoué. C'est le seul point qui délivre un jeton de session à
        un compte déjà enrôlé.
      operationId: verifyTotpCode
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCodeInput'
      responses:
        '401':
          description: Code refusé, rejoué, ou défi absent, expiré ou invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFailure'
        '429':
          description: Trop de tentatives — le défi est verrouillé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFailure'
        '200':
          description: Session ouverte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
      x-requirements:
      - AUTH-007
  /reference-values:
    get:
      tags:
      - ADMIN
      summary: Lister les valeurs de référentiel.
      operationId: listReferenceValues
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: domain
        in: query
        required: false
        description: Filtre optionnel sur un domaine de référentiel (ex. MEMBER_CATEGORY).
        schema:
          type: string
          maxLength: 80
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '200':
          description: Collection paginée de valeurs de référentiel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceValuePage'
      x-requirements:
      - ADM-001
      - ADM-002
      - ADM-003
      - ADM-004
      - ADM-005
    post:
      tags:
      - ADMIN
      summary: Créer une valeur de référentiel.
      operationId: createReferenceValue
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '200':
          description: Valeur déjà existante et identique (rejeu idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceValueView'
        '201':
          description: Valeur de référentiel créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceValueView'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceValueInput'
      x-requirements:
      - ADM-001
      - ADM-002
      - ADM-003
      - ADM-004
      - ADM-005
  /reference-values/{id}:
    patch:
      tags:
      - ADMIN
      summary: Mettre à jour une valeur de référentiel.
      operationId: updateReferenceValue
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: If-Match
        in: header
        required: true
        description: Version attendue (verrou optimiste). Un écart avec la version courante produit un 409.
        schema:
          type: integer
          format: int64
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '200':
          description: Valeur de référentiel mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceValueView'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceValueUpdate'
      x-requirements:
      - ADM-001
      - ADM-002
      - ADM-003
      - ADM-004
      - ADM-005
  /organizations:
    get:
      tags:
      - MEMBER
      summary: Rechercher les entreprises.
      operationId: listOrganizations
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: status
        in: query
        required: false
        description: Filtre sur le statut de l'entreprise (ACTIVE, DORMANT, PROSPECT…).
        schema:
          type: string
          maxLength: 30
      - name: organizationType
        in: query
        required: false
        description: Filtre sur le type d'entreprise.
        schema:
          type: string
          maxLength: 40
      - name: sectorCode
        in: query
        required: false
        description: Filtre sur le secteur d'activité (code de référentiel).
        schema:
          type: string
          maxLength: 80
      - name: search
        in: query
        required: false
        description: Recherche libre sur la raison sociale ou le nom commercial.
        schema:
          type: string
          maxLength: 120
      - name: sort
        in: query
        required: false
        description: 'Tri : legalName ou status, suffixé de ,asc ou ,desc.'
        schema:
          type: string
          maxLength: 40
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '200':
          description: Collection paginée d'entreprises
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
      x-requirements:
      - MEM-001
      - MEM-002
      - MEM-003
      - MEM-004
      - MEM-005
      - MEM-006
      - MEM-007
      - MEM-008
    post:
      tags:
      - MEMBER
      summary: Créer une entreprise.
      operationId: createOrganization
      description: >-
        Crée une entreprise membre. Idempotent sur l'identifiant métier
        (identifierType + identifierValue), unique en base : 201 pour une création réelle,
        200 pour le rejeu d'une entreprise identique, 409 si l'identifiant est déjà pris par
        une entreprise différente. L'en-tête Idempotency-Key est exigé. Périmètre R0 :
        MEM-001 (dossier membre) ; la détection de doublons (MEM-002) et les identifiants
        multiples relèvent d'incréments suivants.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '200':
          description: Rejeu idempotent — entreprise déjà existante à l'identique
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationView'
        '201':
          description: Entreprise créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationView'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      x-requirements:
      - MEM-001
  /organizations/{id}:
    get:
      tags:
      - MEMBER
      summary: Consulter la fiche entreprise (cœur).
      description: >-
        Retourne le CŒUR de la fiche entreprise (identité, type, secteur, statut, niveau
        de risque). La « fiche 360° » complète (adhésion, groupement, contacts, historique,
        montants dus/payés, documents) sera composée par incréments : les montants
        dépendent d'ADR-006 (read-model) et restent hors du module MEMBER. Périmètre R0
        réellement couvert par cette opération : MEM-001 (consultation) ; MEM-003 partiel.
        Les autres exigences MEM-* du bloc x-requirements relèvent des incréments suivants.
      operationId: getOrganization
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '200':
          description: Fiche entreprise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationView'
      x-requirements:
      - MEM-001
      - MEM-002
      - MEM-003
      - MEM-004
      - MEM-005
      - MEM-006
      - MEM-007
      - MEM-008
    patch:
      tags:
      - MEMBER
      summary: Mettre à jour une entreprise.
      operationId: updateOrganization
      description: >-
        Modifie les champs descriptifs d'une entreprise (raison sociale, nom commercial,
        type, secteur), sous verrou optimiste (en-tête If-Match). Le statut de cycle de vie
        et le niveau de risque ne sont PAS modifiables ici (transitions dédiées) ;
        l'identifiant métier non plus. Périmètre R0 : MEM-001 (édition du dossier membre).
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: If-Match
        in: header
        required: true
        description: Version attendue (verrou optimiste). Un écart avec la version courante produit un 409.
        schema:
          type: integer
          format: int64
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '200':
          description: Entreprise mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationView'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
      x-requirements:
      - MEM-001
  /organizations/{id}/history:
    get:
      tags:
      - MEMBER
      summary: Consulter l’historique des statuts.
      description: >-
        Historique paginé des changements de statut des adhésions de l'entreprise, du plus
        récent au plus ancien. Périmètre R0 : les transitions de statut d'adhésion
        (member.membership_status_history). MEM-004 (historique) est la seule exigence de
        ce bloc réellement couverte ici.
      operationId: getOrganizationHistory
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '200':
          description: Historique paginé des changements de statut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationHistoryPage'
      x-requirements:
      - MEM-004
  /memberships:
    get:
      tags:
      - MEMBER
      summary: Lister les adhésions.
      operationId: listMemberships
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: status
        in: query
        required: false
        description: Filtre sur le statut d'adhésion (ACTIVE, DORMANT, PROSPECT…).
        schema:
          type: string
          maxLength: 30
      - name: categoryCode
        in: query
        required: false
        description: Filtre sur la catégorie de cotisation (code de référentiel).
        schema:
          type: string
          maxLength: 50
      - name: groupCode
        in: query
        required: false
        description: Filtre sur le code du groupement professionnel principal de l'entreprise.
        schema:
          type: string
          maxLength: 60
      - name: search
        in: query
        required: false
        description: Recherche sur le numéro d'adhésion ou la raison sociale de l'entreprise.
        schema:
          type: string
          maxLength: 120
      - name: sort
        in: query
        required: false
        description: 'Tri : membershipNumber, status, organizationLegalName ou primaryGroupName, suffixé de ,asc ou ,desc.'
        schema:
          type: string
          maxLength: 40
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '200':
          description: Collection paginée d'adhésions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
      x-requirements:
      - MEM-001
      - MEM-002
      - MEM-003
      - MEM-004
      - MEM-005
      - MEM-006
      - MEM-007
      - MEM-008
    post:
      tags:
      - MEMBER
      summary: Créer une adhésion.
      operationId: createMembership
      parameters:
